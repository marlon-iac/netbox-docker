services:

  netbox:
    build:
      context: .
      dockerfile: Dockerfile-Plugins
      args:
        - NETBOX_VERSION=${NETBOX_VERSION:-v4.5.8-4.0.2}
    image: netbox-with-diode:latest
    restart: unless-stopped
    pull_policy: never
    environment:
      SUPERUSER_NAME: ${SUPERUSER_NAME:-admin}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-admin@example.com}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-Admin@1234567890}
      SKIP_SUPERUSER: "${SKIP_SUPERUSER:-false}"
      TIME_ZONE: "${TIME_ZONE:-America/Sao_Paulo}"
    ports:
      - "${NETBOX_PORT:-8000}:8080"
    healthcheck:
      start_period: 500s
      timeout: 30s
      interval: 30s
      retries: 5

  netbox-worker:
    image: netbox-with-diode:latest
    build:
      context: .
      dockerfile: Dockerfile-Plugins
      args:
        - NETBOX_VERSION=${NETBOX_VERSION:-v4.5.8-4.0.2}
    restart: unless-stopped
    pull_policy: never

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  redis-cache:
    restart: unless-stopped