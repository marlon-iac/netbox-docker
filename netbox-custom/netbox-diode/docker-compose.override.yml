services:

  netbox:
    build:
      context: .
      dockerfile: Dockerfile-Plugins
      args:
        - NETBOX_VERSION=${NETBOX_VERSION}
    image: netbox-with-diode:latest
    restart: unless-stopped
    pull_policy: never
    environment:
      SUPERUSER_NAME: ${SUPERUSER_NAME}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
      SKIP_SUPERUSER: ${SKIP_SUPERUSER}
      TIME_ZONE: ${TIME_ZONE}
    ports:
      - "${NETBOX_PORT}:8080"
    healthcheck:
      start_period: 500s
      timeout: 30s
      interval: 30s
      retries: 5

  netbox-worker:
    image: netbox-with-diode:latest
    restart: unless-stopped
    pull_policy: never

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  redis-cache:
    restart: unless-stopped