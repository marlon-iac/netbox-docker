services:

  netbox:
    image: netboxcommunity/netbox:v4.5.8-4.0.2
    environment:
      # Variables loaded from netbox.env (official approach)
      # SUPERUSER_NAME, SUPERUSER_EMAIL, SUPERUSER_PASSWORD, SECRET_KEY, etc.
      TIME_ZONE: "America/Sao_Paulo"
      SKIP_SUPERUSER: "false"  # Set to "true" after first startup
    restart: unless-stopped
    ports:
      - "8000:8080"
    healthcheck:
      start_period: 400s
      timeout: 30s
      interval: 30s
      retries: 5

  netbox-worker:
    image: netboxcommunity/netbox:v4.5.8-4.0.2
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  redis-cache:
    restart: unless-stopped
