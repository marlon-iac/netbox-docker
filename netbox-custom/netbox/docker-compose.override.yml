services:

  netbox:
    image: netboxcommunity/netbox:v4.5.8-4.0.2
    env_file:
      - ./netbox-custom.env  # Arquivo com variáveis externas (copiado de .env.example)
    restart: unless-stopped
    ports:
      - "8000:8080"
    healthcheck:
      start_period: 500s
      timeout: 30s
      interval: 30s
      retries: 5

  netbox-worker:
    image: netboxcommunity/netbox:v4.5.8-4.0.2
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  redis-cache:
    restart: unless-stopped
