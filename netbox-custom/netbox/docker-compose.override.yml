services:

  netbox:
    image: netboxcommunity/netbox:v4.5.8-4.0.2
    env_file:
      - ../.env  # Arquivo com variáveis externas na RAIZ do projeto (/opt/netbox-docker/.env)
    restart: unless-stopped
    ports:
      - "${NETBOX_PORT:-8000}:8080"
    healthcheck:
      start_period: 500s
      timeout: 30s
      interval: 30s
      retries: 5

  netbox-worker:
    image: netboxcommunity/netbox:v4.5.8-4.0.2
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  redis-cache:
    restart: unless-stopped
