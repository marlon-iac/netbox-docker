services:

  netbox:
    image: netboxcommunity/netbox:${NETBOX_VERSION}
    environment:
      SUPERUSER_NAME: ${SUPERUSER_NAME}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
      SKIP_SUPERUSER: "${SKIP_SUPERUSER}"
      TIME_ZONE: "${TIME_ZONE}"
    restart: unless-stopped
    ports:
      - "${NETBOX_PORT}:8080"
    healthcheck:
      start_period: 500s
      timeout: 30s
      interval: 30s
      retries: 5

  netbox-worker:
    image: netboxcommunity/netbox:${NETBOX_VERSION}
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  redis-cache:
    restart: unless-stopped
